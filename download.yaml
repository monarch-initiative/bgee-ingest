### This file is a YAML configuration that specifies
### the data to be downloaded and ingested for this project.
### The configuration is used by `kghub-downloader`.
### For more information, see https://github.com/monarch-initiative/kghub-downloader
---
# Download configuration for bgee-ingest
# 11 species-specific expression files. The {BGEE_VERSION} placeholder is
# substituted by kghub-downloader from the BGEE_VERSION env var, which is
# resolved by `scripts/resolve_bgee_version.py` (probes https://bgee.org/ftp/
# for the highest bgee_vM_N directory that contains expression call data).

# Non-model organism species (actively used in transform)
- url: "https://bgee.org/ftp/bgee_v{BGEE_VERSION}/download/calls/expr_calls/Homo_sapiens_expr_simple.tsv.gz"
  local_name: "data/Homo_sapiens_expr_simple.tsv.gz"
- url: "https://bgee.org/ftp/bgee_v{BGEE_VERSION}/download/calls/expr_calls/Bos_taurus_expr_simple.tsv.gz"
  local_name: "data/Bos_taurus_expr_simple.tsv.gz"
- url: "https://bgee.org/ftp/bgee_v{BGEE_VERSION}/download/calls/expr_calls/Canis_lupus_familiaris_expr_simple.tsv.gz"
  local_name: "data/Canis_lupus_familiaris_expr_simple.tsv.gz"
