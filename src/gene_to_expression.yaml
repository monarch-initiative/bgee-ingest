name: 'bgee_gene_to_expression'

reader:
  # List of files to be ingested
  # We're skipping the model organisms because we get them from other sources
  files:
    - '../data/Bos_taurus_expr_simple.tsv.gz'
    - '../data/Canis_lupus_familiaris_expr_simple.tsv.gz'
    - '../data/Gallus_gallus_expr_simple.tsv.gz'
    - '../data/Homo_sapiens_expr_simple.tsv.gz'
    - '../data/Sus_scrofa_expr_simple.tsv.gz'
  # Model organisms commented out - obtained from other sources
  #  - '../data/Caenorhabditis_elegans_expr_simple.tsv.gz'
  #  - '../data/Danio_rerio_expr_simple.tsv.gz'
  #  - '../data/Drosophila_melanogaster_expr_simple.tsv.gz'
  #  - '../data/Mus_musculus_expr_simple.tsv.gz'
  #  - '../data/Rattus_norvegicus_expr_simple.tsv.gz'
  #  - '../data/Xenopus_laevis_expr_simple.tsv.gz'
  format: 'csv'
  delimiter: '\t'
  columns:
    - 'Gene ID'
    - 'Gene name'
    - 'Anatomical entity ID'
    - 'Anatomical entity name'
    - 'Expression'
    - 'Call quality'
    - 'FDR': 'float'
    - 'Expression score' : 'float'
    - 'Expression rank' : 'float'
  filters:
    - inclusion: 'include'
      column: 'Expression rank'
      filter_code: 'lt'
      value: 10000
    - inclusion: 'include'
      column: 'Expression score'
      filter_code: 'gt'
      value: 70
    - inclusion: 'include'
      column: 'FDR'
      filter_code: 'lt'
      value: 0.05
    - inclusion: 'include'
      column: 'Expression'
      filter_code: 'eq'
      value: "present"

writer:
  edge_properties:
    - 'id'
    - 'category'
    - 'subject'
    - 'predicate'
    - 'object'
    - 'primary_knowledge_source'
    - 'aggregator_knowledge_source'
    - 'knowledge_level'
    - 'agent_type'
    - 'object_specialization_qualifier'
